[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Toby-Faucher/kiln"
rust-version = "1.87"

[workspace.dependencies]
wgpu = "=30.0.1"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
pollster = "0.4"
log = "0.4"

# wasm-only
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "=0.3.104"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
